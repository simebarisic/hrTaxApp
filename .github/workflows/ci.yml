name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Postavi JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        run: mvn -B clean verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Postavi Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        run: npm install

      - name: npm run build
        run: npm run build

  docker-build:
    name: Docker image build (validacija, PR-ovi i push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t hrtaxapp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t hrtaxapp-frontend:ci ./frontend

  docker-publish:
    name: Docker image build & push (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Samo na push u main - ne za PR-ove (nemaju packages:write dozvolu,
    # i ne zelimo objavljivati slike za svaki neuspjeli/probni PR).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Odredi lowercase naziv repozitorija (GHCR to zahtijeva)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Prijava na GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Postavi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}-backend:latest
            ghcr.io/${{ env.REPO_LC }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}-frontend:latest
            ghcr.io/${{ env.REPO_LC }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # GitOps: upiše novi tag u apps-config (apps/hr-tax-app/envs/dev), a Argo CD ga deploya na DEV.
  # Pristup apps-configu: GitHub App (varijabla CONFIG_APP_CLIENT_ID + secret CONFIG_APP_PRIVATE_KEY).
  # Dok varijabla ne postoji, job se preskače.
  update-dev:
    name: Novi tag na DEV (apps-config)
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && vars.CONFIG_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: apps-config-hr-tax-app-dev
      cancel-in-progress: false
    steps:
      - name: Token za apps-config (GitHub App, vrijedi 1 h)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONFIG_APP_PRIVATE_KEY }}
          owner: simebarisic
          repositories: apps-config

      - name: Checkout apps-config
        uses: actions/checkout@v7
        with:
          repository: simebarisic/apps-config
          token: ${{ steps.app-token.outputs.token }}

      - name: Upiši tag i pushaj
        run: |
          TAG="${GITHUB_SHA}"   # isti tag koji je build objavio na GHCR
          ./scripts/set-tag.sh hr-tax-app dev "$TAG"
          if git diff --quiet; then echo "DEV je već na $TAG"; exit 0; fi
          git config user.name "hr-tax-app-ci"
          git config user.email "hr-tax-app-ci@users.noreply.github.com"
          git commit -qam "hr-tax-app: DEV -> $TAG ($GITHUB_SHA)"
          # Ako je netko u međuvremenu pushao u apps-config, povuci i pokušaj ponovno.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
