server:
  port: 8080

spring:
  application:
    name: hr-kapitalna-dobit-tax-app
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrtaxapp}
    username: ${DB_USER:hrtaxapp}
    password: ${DB_PASSWORD:hrtaxapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    hr.porezno.taxapp: INFO

app:
  cors:
    # Comma-separated lista dopustenih origina za frontend. Default pokriva
    # Vite dev server (5173), CRA-stil dev server (3000) i Docker/Nginx
    # frontend kontejner (8081). Prilagodi preko env varijable
    # APP_CORS_ALLOWED_ORIGINS za drugu domenu/port (npr. produkcija).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
