# Sve se po defaultu veze SAMO na localhost - aplikacija nema autentikaciju, a drzi stvarne financijske podatke.
# Za pristup s drugog uredjaja u mrezi (npr. RPi homelab) postavi FRONTEND_BIND=0.0.0.0 u .env
# i OBAVEZNO ukljuci basic auth: docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d
# (vidi README, sekcija "Sigurnost").
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrtaxapp-postgres
    environment:
      POSTGRES_DB: hrtaxapp
      POSTGRES_USER: hrtaxapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hrtaxapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrtaxapp -d hrtaxapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hrtaxapp-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hrtaxapp
      DB_USER: hrtaxapp
      DB_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
      APP_STRIKE_FEE_INCLUDED_IN_AMOUNT: ${APP_STRIKE_FEE_INCLUDED_IN_AMOUNT:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: hrtaxapp-frontend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:8081:80"
    depends_on:
      - backend

volumes:
  hrtaxapp-pgdata:
