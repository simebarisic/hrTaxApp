# Shema portova za sve lokalne Docker aplikacije: web 30xx, API 80xx, baza 54xx (xx = broj aplikacije).
# hr-tax-app = 50: web 3050, API 8050, baza 5450 - sve samo 127.0.0.1 (vidi dolje).

# Sve se po defaultu veze SAMO na localhost - aplikacija nema autentikaciju, a drzi stvarne financijske podatke.
# Za pristup s drugog uredjaja u mrezi (npr. RPi homelab) postavi FRONTEND_BIND=0.0.0.0 u .env
# i OBAVEZNO ukljuci basic auth: docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d
# (vidi README, sekcija "Sigurnost").
services:
  postgres:
    mem_limit: 512m
    image: postgres:16-alpine
    container_name: hrtaxapp-postgres
    environment:
      POSTGRES_DB: hrtaxapp
      POSTGRES_USER: hrtaxapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - hrtaxapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrtaxapp -d hrtaxapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    build:
      context: ./backend
    container_name: hrtaxapp-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hrtaxapp
      DB_USER: hrtaxapp
      DB_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env (vidi .env.example)}
      APP_STRIKE_FEE_INCLUDED_IN_AMOUNT: ${APP_STRIKE_FEE_INCLUDED_IN_AMOUNT:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3050}
    ports:
      - "127.0.0.1:8050:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    build:
      context: ./frontend
    container_name: hrtaxapp-frontend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3050:80"
    depends_on:
      - backend

volumes:
  hrtaxapp-pgdata:
